<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>۴۰۴ — میز پیدا نشد | کافه دنج</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;800;900&display=swap');

  :root{
    --bg:#140608;
    --maroon:#2b0f12;
    --gold:#C9A24D;
    --gold-bright:#E8C874;
    --cream:#F4E9D8;
    --card:#3a1418;
    --line:rgba(201,162,77,0.16);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    font-family:'Vazirmatn', sans-serif;
    color:var(--gold);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    background:
      linear-gradient(180deg, var(--bg) 0%, #2b0f12 60%),
      radial-gradient(circle at 15% 0%, rgba(201, 162, 77, 0.06), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(201, 162, 77, 0.05), transparent 35%);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ambient floating coffee beans */
  .beans{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .bean{
    position:absolute;
    width:14px;height:20px;
    background:linear-gradient(135deg, #6b3a1f, #3a1e10);
    border-radius:60% 60% 60% 60% / 70% 70% 30% 30%;
    opacity:0.25;
    filter:blur(0.3px);
    animation:drift linear infinite;
  }
  .bean::after{
    content:'';
    position:absolute;
    top:10%;left:50%;
    width:1.5px;height:80%;
    background:rgba(0,0,0,0.4);
    transform:translateX(-50%) rotate(8deg);
    border-radius:2px;
  }
  @keyframes drift{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(-120vh) rotate(360deg);}
  }

  .wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    padding:48px 32px;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    letter-spacing:0.15em;
    color:var(--gold-bright);
    opacity:0.85;
    margin-bottom:38px;
    animation:fadeDown 0.9s ease both;
  }
  .eyebrow::before,.eyebrow::after{
    content:'';
    width:22px;height:1px;
    background:var(--gold);
    opacity:0.5;
  }

  /* scene: cup + steam forming the number */
  .scene{
    position:relative;
    height:230px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom:8px;
    animation:fadeUp 1s ease both 0.15s;
  }

  .steam-field{
    position:absolute;
    bottom:118px;
    left:50%;
    transform:translateX(-50%);
    width:340px;
    height:150px;
    pointer-events:none;
  }
  .steam-field path{
    stroke:var(--gold);
    stroke-width:2;
    fill:none;
    opacity:0;
    stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(201,162,77,0.35));
  }
  .steam-field path.s1{animation:steamRise 4.5s ease-in-out infinite;}
  .steam-field path.s2{animation:steamRise 4.5s ease-in-out infinite 1.1s;}
  .steam-field path.s3{animation:steamRise 4.5s ease-in-out infinite 2.3s;}
  .steam-field path.s4{animation:steamRise 4.5s ease-in-out infinite 3.2s;}

  @keyframes steamRise{
    0%{opacity:0; transform:translateY(10px) scaleY(0.8);}
    15%{opacity:0.55;}
    55%{opacity:0.35;}
    100%{opacity:0; transform:translateY(-55px) scaleY(1.15);}
  }

  .cup{
    position:relative;
    width:120px;
    height:96px;
  }
  .cup-body{
    position:absolute;
    bottom:14px;left:8px;
    width:104px;height:64px;
    background:linear-gradient(180deg, #2c1210, #1c0b0a);
    border:2px solid var(--gold);
    border-top:none;
    border-radius:0 0 46px 46px;
    box-shadow: inset 0 8px 14px rgba(0,0,0,0.5), 0 0 24px rgba(201,162,77,0.12);
  }
  .cup-liquid{
    position:absolute;
    top:0;left:0;right:0;
    height:10px;
    background:linear-gradient(180deg, #7a4a22, #4a2a12);
    border-radius:2px;
  }
  .cup-handle{
    position:absolute;
    bottom:26px; right:-16px;
    width:34px;height:34px;
    border:8px solid var(--gold);
    border-left-color:transparent;
    border-radius:50%;
    opacity:0.9;
  }
  .saucer{
    position:absolute;
    bottom:2px;left:-14px;
    width:148px;height:14px;
    background:linear-gradient(180deg, #2f1614, #190a09);
    border:1.5px solid var(--gold);
    border-radius:50%;
    opacity:0.85;
  }
  .ring{
    position:absolute;
    bottom:-6px;
    width:190px;height:26px;
    left:50%;
    transform:translateX(-50%);
    border:1px solid var(--gold);
    border-radius:50%;
    opacity:0.12;
  }

  .num{
    font-size:clamp(72px, 15vw, 128px);
    font-weight:900;
    line-height:1;
    letter-spacing:0.02em;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #8a6a2e);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 60px rgba(201,162,77,0.18);
    margin-bottom:4px;
    animation:fadeUp 1s ease both 0.3s;
    position:relative;
  }

  h1.headline{
    font-size:clamp(20px, 3.2vw, 28px);
    font-weight:800;
    color:var(--cream);
    margin-top:18px;
    margin-bottom:14px;
    animation:fadeUp 1s ease both 0.45s;
  }

  p.sub{
    font-size:15.5px;
    font-weight:300;
    line-height:2;
    color:var(--gold);
    opacity:0.75;
    max-width:480px;
    margin:0 auto 40px;
    animation:fadeUp 1s ease both 0.6s;
  }

  .actions{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    animation:fadeUp 1s ease both 0.75s;
  }

  .btn{
    position:relative;
    overflow:hidden;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 30px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    color:var(--bg);
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    border:none;
    border-radius:999px;
    cursor:pointer;
    text-decoration:none;
    transition:transform 0.35s ease, box-shadow 0.35s ease;
    box-shadow:0 8px 24px rgba(201,162,77,0.18);
  }
  .btn:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 34px rgba(201,162,77,0.3);
  }
  .btn:active{transform:translateY(-1px);}
  .btn .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.5);
    transform:scale(0);
    animation:rippleAnim 0.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{
    to{transform:scale(4); opacity:0;}
  }

  .btn.ghost{
    background:transparent;
    color:var(--gold);
    border:1px solid var(--line);
    box-shadow:none;
  }
  .btn.ghost:hover{
    background:rgba(201,162,77,0.06);
    border-color:var(--gold);
  }

  .code-tag{
    margin-top:34px;
    font-size:11.5px;
    letter-spacing:0.12em;
    color:var(--gold);
    opacity:0.4;
    animation:fadeUp 1s ease both 0.9s;
  }

  @keyframes fadeDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  @media (max-width:520px){
    .scene{height:190px;}
    .actions{flex-direction:column; align-items:center;}
    .btn{width:100%; max-width:280px; justify-content:center;}
  }
</style>
</head>
<body>

<div class="beans" id="beans"></div>

<div class="wrap">
  <div class="eyebrow">کافه دنج</div>

  <div class="scene">
    <svg class="steam-field" viewBox="0 0 340 150">
      <path class="s1" d="M150 150 C 140 120, 165 110, 155 85 C 145 60, 168 50, 160 25"/>
      <path class="s2" d="M175 150 C 185 118, 160 108, 172 82 C 184 56, 158 46, 170 20"/>
      <path class="s3" d="M130 150 C 122 122, 145 112, 135 88 C 125 64, 148 54, 138 30"/>
      <path class="s4" d="M195 150 C 205 120, 182 110, 192 86 C 202 62, 178 52, 188 28"/>
    </svg>

    <div class="cup">
      <div class="ring"></div>
      <div class="saucer"></div>
      <div class="cup-body"><div class="cup-liquid"></div></div>
      <div class="cup-handle"></div>
    </div>
  </div>

  <div class="num">۴۰۴</div>

  <h1 class="headline">این میز رو هیچ‌کس سفارش نداده</h1>
  <p class="sub">
    به‌نظر می‌رسه صفحه‌ای که دنبالش می‌گردی، مثل فنجون خالی شده و رفته.
    نشونی رو یه بار دیگه چک کن یا برگرد به کافه.
  </p>

  <div class="actions">
    <a href="/" class="btn" id="homeBtn">برگشت به کافه دنج</a>
    <a href="javascript:history.back()" class="btn ghost">برگشت به صفحه قبل</a>
  </div>

  <div class="code-tag">ERROR · 404 · NOT FOUND</div>
</div>

<script>
  // ambient beans
  const beansEl = document.getElementById('beans');
  const total = 14;
  for(let i=0;i<total;i++){
    const b = document.createElement('div');
    b.className = 'bean';
    const size = 10 + Math.random()*10;
    b.style.width = size+'px';
    b.style.height = (size*1.4)+'px';
    b.style.left = Math.random()*100+'vw';
    b.style.top = (100 + Math.random()*20)+'vh';
    b.style.animationDuration = (14 + Math.random()*14)+'s';
    b.style.animationDelay = (Math.random()*10)+'s';
    beansEl.appendChild(b);
  }

  // ripple on button
  document.querySelectorAll('.btn').forEach(btn=>{
    btn.addEventListener('click', function(e){
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size+'px';
      ripple.style.left = (e.clientX - rect.left - size/2)+'px';
      ripple.style.top = (e.clientY - rect.top - size/2)+'px';
      this.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 650);
    });
  });
</script>

</body>
</html>
