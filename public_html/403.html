<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>۴۰۳ — دسترسی ممنوع | کافه دنج</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;800;900&display=swap');

  :root{
    --bg:#140608;
    --maroon:#2b0f12;
    --gold:#C9A24D;
    --gold-bright:#E8C874;
    --cream:#F4E9D8;
    --card:#3a1418;
    --line:rgba(201,162,77,0.16);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}

  body{
    font-family:'Vazirmatn', sans-serif;
    color:var(--gold);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    background:
      linear-gradient(180deg, var(--bg) 0%, #2b0f12 60%),
      radial-gradient(circle at 15% 0%, rgba(201, 162, 77, 0.06), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(201, 162, 77, 0.05), transparent 35%);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .fog{
    position:fixed; inset:0;
    background:radial-gradient(ellipse 60% 40% at 50% 85%, rgba(201,162,77,0.05), transparent 70%);
    animation:fogPulse 8s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes fogPulse{
    0%,100%{opacity:0.6;}
    50%{opacity:1;}
  }

  .wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    padding:48px 32px;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    letter-spacing:0.15em;
    color:var(--gold-bright);
    opacity:0.85;
    margin-bottom:30px;
    animation:fadeDown 0.9s ease both;
  }
  .eyebrow::before,.eyebrow::after{
    content:'';
    width:22px;height:1px;
    background:var(--gold);
    opacity:0.5;
  }

  /* scene: door with hanging sign + glowing keyhole */
  .scene{
    position:relative;
    height:250px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom:8px;
    animation:fadeUp 1s ease both 0.15s;
  }

  .sign-post{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:1px; height:26px;
    background:var(--gold);
    opacity:0.5;
  }

  .sign{
    position:absolute;
    top:24px; left:50%;
    width:118px;
    transform-origin:top center;
    transform:translateX(-50%) rotate(0deg);
    animation:swing 4.5s ease-in-out infinite;
  }
  .sign-plate{
    padding:9px 6px;
    border:1.5px solid var(--gold);
    border-radius:6px;
    background:linear-gradient(180deg, #22100f, #170a09);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--gold-bright);
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  @keyframes swing{
    0%,100%{transform:translateX(-50%) rotate(-4deg);}
    50%{transform:translateX(-50%) rotate(4deg);}
  }

  .door{
    position:relative;
    width:150px;
    height:196px;
    margin-top:44px;
    background:linear-gradient(160deg, #331512, #200c0b 60%, #170908);
    border:2px solid var(--gold);
    border-radius:8px 8px 4px 4px;
    box-shadow:
      inset 0 0 0 6px rgba(201,162,77,0.05),
      inset 0 20px 40px rgba(0,0,0,0.45),
      0 20px 50px rgba(0,0,0,0.5);
  }
  .door::before{
    content:'';
    position:absolute;
    inset:14px;
    border:1px solid var(--line);
    border-radius:4px;
  }
  .door::after{
    content:'';
    position:absolute;
    top:34px; bottom:34px; left:50%;
    width:1px;
    background:var(--line);
  }

  .keyhole{
    position:absolute;
    right:22px; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    z-index:3;
  }
  .keyhole::before{
    content:'';
    position:absolute;
    top:0; left:3px;
    width:10px; height:10px;
    border-radius:50%;
    background:radial-gradient(circle, var(--gold-bright), var(--gold));
    box-shadow:0 0 10px 2px rgba(201,162,77,0.6);
    animation:glow 2.4s ease-in-out infinite;
  }
  .keyhole::after{
    content:'';
    position:absolute;
    top:8px; left:6px;
    width:4px; height:9px;
    background:var(--gold);
    clip-path:polygon(50% 0, 100% 100%, 0 100%);
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 8px 1px rgba(201,162,77,0.4); opacity:0.8;}
    50%{box-shadow:0 0 18px 5px rgba(201,162,77,0.85); opacity:1;}
  }

  .light-beam{
    position:absolute;
    right:24px; top:50%;
    width:60px; height:2px;
    transform:translateY(-50%);
    background:linear-gradient(90deg, rgba(201,162,77,0.5), transparent);
    filter:blur(1px);
    animation:beamPulse 2.4s ease-in-out infinite;
  }
  @keyframes beamPulse{
    0%,100%{opacity:0.3;}
    50%{opacity:0.8;}
  }

  .handle{
    position:absolute;
    left:22px; top:50%;
    transform:translateY(-50%);
    width:8px; height:34px;
    border-radius:4px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    box-shadow:0 0 10px rgba(201,162,77,0.3);
  }

  .num{
    font-size:clamp(72px, 15vw, 128px);
    font-weight:900;
    line-height:1;
    letter-spacing:0.02em;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #8a6a2e);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 60px rgba(201,162,77,0.18);
    margin-bottom:4px;
    animation:fadeUp 1s ease both 0.3s;
  }

  h1.headline{
    font-size:clamp(20px, 3.2vw, 28px);
    font-weight:800;
    color:var(--cream);
    margin-top:18px;
    margin-bottom:14px;
    animation:fadeUp 1s ease both 0.45s;
  }

  p.sub{
    font-size:15.5px;
    font-weight:300;
    line-height:2;
    color:var(--gold);
    opacity:0.75;
    max-width:480px;
    margin:0 auto 40px;
    animation:fadeUp 1s ease both 0.6s;
  }

  .actions{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    animation:fadeUp 1s ease both 0.75s;
  }

  .btn{
    position:relative;
    overflow:hidden;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 30px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    color:var(--bg);
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    border:none;
    border-radius:999px;
    cursor:pointer;
    text-decoration:none;
    transition:transform 0.35s ease, box-shadow 0.35s ease;
    box-shadow:0 8px 24px rgba(201,162,77,0.18);
  }
  .btn:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 34px rgba(201,162,77,0.3);
  }
  .btn:active{transform:translateY(-1px);}
  .btn .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.5);
    transform:scale(0);
    animation:rippleAnim 0.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{transform:scale(4); opacity:0;} }

  .btn.ghost{
    background:transparent;
    color:var(--gold);
    border:1px solid var(--line);
    box-shadow:none;
  }
  .btn.ghost:hover{
    background:rgba(201,162,77,0.06);
    border-color:var(--gold);
  }

  .code-tag{
    margin-top:34px;
    font-size:11.5px;
    letter-spacing:0.12em;
    color:var(--gold);
    opacity:0.4;
    animation:fadeUp 1s ease both 0.9s;
  }

  @keyframes fadeDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  @media (max-width:520px){
    .scene{height:220px;}
    .door{width:130px; height:172px;}
    .actions{flex-direction:column; align-items:center;}
    .btn{width:100%; max-width:280px; justify-content:center;}
  }
</style>
</head>
<body>

<div class="fog"></div>

<div class="wrap">
  <div class="eyebrow">کافه دنج</div>

  <div class="scene">
    <div class="sign-post"></div>
    <div class="sign"><div class="sign-plate">فقط کارکنان</div></div>
    <div class="door">
      <div class="handle"></div>
      <div class="light-beam"></div>
      <div class="keyhole"></div>
    </div>
  </div>

  <div class="num">۴۰۳</div>

  <h1 class="headline">این گوشه از کافه فقط برای کارکنانه</h1>
  <p class="sub">
    درِ این بخش قفله و کلیدش دست توی نیست.
    اگه فکر می‌کنی اشتباهی شده، با کافه دنج در تماس باش.
  </p>

  <div class="actions">
    <a href="/" class="btn">برگشت به کافه دنج</a>
    <a href="javascript:history.back()" class="btn ghost">برگشت به صفحه قبل</a>
  </div>

  <div class="code-tag">ERROR · 403 · FORBIDDEN</div>
</div>

<script>
  document.querySelectorAll('.btn').forEach(btn=>{
    btn.addEventListener('click', function(e){
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size+'px';
      ripple.style.left = (e.clientX - rect.left - size/2)+'px';
      ripple.style.top = (e.clientY - rect.top - size/2)+'px';
      this.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 650);
    });
  });
</script>

</body>
</html>
